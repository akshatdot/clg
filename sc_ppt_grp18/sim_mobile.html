<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>

<!-- Execution locked to window.onload to ensure DOM and WebKit are completely ready -->
<script>
window.onload = function() {
  const byId = function(id) { return document.getElementById(id); };
  const pn = byId('pn');
  
  if (!window.THREE) {
    pn.innerHTML = '<h3 style="color:#c00000;">3D Engine Failed</h3><p>The Three.js library was blocked by your browser or network. Please check connection.</p>';
    return;
  }

  const R = [
    ["Auto", 95, -20, 3], ["Bike", 61, -10, 3], ["Bike Saver", 54, -10, 3], 
    ["Uber GO AC", 98, -42, 2], ["GO Priority", 135, -40, 1], ["GO Sedan", 99, -80, 2], 
    ["Premier Sedan", 162, -80, 2], ["Uber XL", 214, -90, 4], ["Premier XL", 260, -97, 4], 
    ["Black", 326, -99, 4]
  ];

  const N = R.length;
  const END = N + 6;
  const ALL = R.map(function(_, i) { return i; });
  
  const dom = function(a, b) { 
    let s = false; 
    for(let d=1; d<=3; d++) { 
      if(R[a][d] > R[b][d]) return false; 
      if(R[a][d] < R[b][d]) s = true; 
    } 
    return s; 
  };
  
  const weak = function(a, b) { return a !== b && [1,2,3].every(function(d) { return R[a][d] <= R[b][d]; }); };
  const strict = function(a, b) { return a !== b && [1,2,3].every(function(d) { return R[a][d] < R[b][d]; }); };
  const nd = function(i) { return !ALL.some(function(j) { return j !== i && dom(j, i); }); };
  const ND = function() { return ALL.filter(nd); };
  
  const IDEAL = [1,2,3].map(function(d) {
    const vals = R.map(function(r) { return r[d]; });
    return Math.min.apply(null, vals);
  });
  
  const NADIR = [1,2,3].map(function(d) {
    const vals = ND().map(function(i) { return R[i][d]; });
    return Math.max.apply(null, vals);
  });
  
  const kd = function(i) {
    const d1 = (R[i][1] - IDEAL[0]) / (NADIR[0] - IDEAL[0]);
    const d2 = (R[i][2] - IDEAL[1]) / (NADIR[1] - IDEAL[1]);
    const d3 = (R[i][3] - IDEAL[2]) / (NADIR[2] - IDEAL[2]);
    return Math.sqrt(d1*d1 + d2*d2 + d3*d3);
  };
  const KI = ND().sort(function(a,b) { return kd(a) - kd(b); })[0];

  const P = function(r) { return new THREE.Vector3((r[1] - 50) / 28, (r[3] - 0.5) * 1.5, (r[2] + 100) / 9.5); };
  const MAXC = new THREE.Vector3(10, 6, 10);
  const ZERO = new THREE.Vector3(0, 0, 0);

  let ex = 4, s = 0, auto = true, surf = true, drag = false, pinching = false;
  let th = 0.75, ph = 1.05, rad = 21, vth = 0, vph = 0, lastMv = 0;
  let pinchStart = 0, pinchRad = 0;

  let rd;
  try {
    rd = new THREE.WebGLRenderer({ canvas: byId('cv'), antialias: (window.devicePixelRatio || 1) < 2 });
  } catch(e) {
    pn.innerHTML = '<h3 style="color:#c00000;">WebGL is unavailable</h3><p>Your browser is blocking 3D graphics.</p>';
    return;
  }

  const cv = byId('cv'), ll = byId('ll'), tip = byId('tip');
  const sc = new THREE.Scene(); sc.background = new THREE.Color(0xfbfbf4);
  const cam = new THREE.PerspectiveCamera(42, 1, 0.1, 100);
  const ctr = new THREE.Vector3(5, 3, 5);
  let W = 1, H = 1;

  const LB = []; let DLB = [];
  
  function mk(t, p, cls, col, dyn) {
    const e = document.createElement('span'); 
    e.className = 'lb ' + (cls || ''); e.textContent = t; 
    if(col) e.style.color = col;
    ll.appendChild(e);
    const o = { e: e, p: p.clone() };
    if (dyn) { DLB.push(o); } else { LB.push(o); }
    return o;
  }
  
  function clrDyn() { DLB.forEach(function(o) { o.e.remove(); }); DLB = []; }

  const V = new THREE.Vector3();
  function place(o) {
    V.copy(o.p).project(cam);
    if (V.z > 1) { 
      o.e.style.display = 'none'; 
      return; 
    }
    o.e.style.display = '';
    o.e.style.transform = 'translate(' + ((V.x * .5 + .5) * W) + 'px, ' + ((-V.y * .5 + .5) * H) + 'px) translate(-50%,-50%)';
  }

  const ax = function(b, c) { sc.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([ZERO, b]), new THREE.LineBasicMaterial({color: c}))); };
  ax(new THREE.Vector3(10.6, 0, 0), 0); ax(new THREE.Vector3(0, 6.6, 0), 0); ax(new THREE.Vector3(0, 0, 10.6), 0);
  const gr = new THREE.GridHelper(10, 10, 0xaaaaaa, 0xdddddd); gr.position.set(5, 0, 5); sc.add(gr);
  const v3 = function(x, y, z) { return new THREE.Vector3(x, y, z); };

  mk('Price (₹)', v3(11, -.4, 0), 'ax', '#a00000'); 
  mk('Time (min)', v3(0, 7.2, 0), 'ax', '#006000'); 
  mk('-Comfort', v3(0, -.4, 11.3), 'ax', '#000090');

  [['54', .3, -.5, -.2], ['326', 9.9, -.5, -.2], ['1', -.7, .75, 0], ['4', -.7, 5.25, 0], ['-99', -.9, -.5, .1], ['-10', -.9, -.5, 9.47]]
    .forEach(function(a) { mk(a[0], v3(a[1], a[2], a[3]), 'ax', '#444'); });

  const S = [];
  R.forEach(function(r, i) {
    const m = new THREE.Mesh(new THREE.SphereGeometry(.26, 20, 16), new THREE.MeshBasicMaterial({color: 0x999999}));
    m.position.copy(P(r)); m.userData.i = i; sc.add(m); S.push(m);
    mk((i+1) + ' ' + r[0], P(r).add(v3(0, .62, 0)));
  });

  const dyn = new THREE.Group(); sc.add(dyn);
  const arrow = function(from, to, col) {
    const d = to.clone().sub(from); 
    dyn.add(new THREE.ArrowHelper(d.clone().normalize(), from, d.length() - .3, col || 0xd01010, .7, .4));
  };

  function addBox(a, b, col, op, edge) {
    const d = b.clone().sub(a), m = new THREE.Mesh(new THREE.BoxGeometry(d.x, d.y, d.z), new THREE.MeshBasicMaterial({color: col, transparent: true, opacity: op, depthWrite: false}));
    m.position.copy(a).add(d.clone().multiplyScalar(.5)); dyn.add(m);
    const e = new THREE.LineSegments(new THREE.EdgesGeometry(m.geometry), new THREE.LineBasicMaterial({color: edge}));
    e.position.copy(m.position); dyn.add(e);
  }

  function gem(p, col, rad, t, tc, dy) {
    const m = new THREE.Mesh(new THREE.OctahedronGeometry(rad), new THREE.MeshBasicMaterial({color: col}));
    m.position.copy(p); dyn.add(m);
    mk(t, p.clone().add(v3(0, dy, 0)), 'ax', tc, true);
  }

  const domSoFar = function(i) { return ALL.some(function(j) { return j < s && dom(j, i); }); };
  function colors() {
    const f = s >= 1 && s <= N ? s-1 : s === N+2 ? ex : s === N+5 ? KI : -1;
    S.forEach(function(m, i) {
      let c = 0x9aa5aa;
      if (s > N) { c = nd(i) ? 0x18a018 : 0xe03030; if (i === f) c = 0xffd700; }
      else if (s >= 1) { if (i === f) c = 0xffd700; else if (domSoFar(i)) c = 0xe03030; else if (i < s) c = 0x2f6fe0; }
      m.material.color.setHex(c); m.scale.setScalar(i === f ? 1.5 : 1);
    });
  }

  function disposeDyn() {
    dyn.traverse(function(o) {
      if (o.geometry) o.geometry.dispose();
      if (o.material) { if (Array.isArray(o.material)) o.material.forEach(function(m) { m.dispose(); }); else o.material.dispose(); }
    });
    dyn.clear();
  }

  function surface() {
    const q = ND(), pts = q.map(function(i) { return P(R[i]); }), pos = [];
    for(let a=0; a < q.length; a++) for(let b=a+1; b < q.length; b++) for(let c=b+1; c < q.length; c++) {
      const A = pts[a], B = pts[b], C = pts[c];
      const d = 2 * (A.x*(B.z - C.z) + B.x*(C.z - A.z) + C.x*(A.z - B.z));
      if(Math.abs(d) < 1e-6) continue;
      const a2 = A.x*A.x + A.z*A.z, b2 = B.x*B.x + B.z*B.z, c2 = C.x*C.x + C.z*C.z;
      const ux = (a2*(B.z - C.z) + b2*(C.z - A.z) + c2*(A.z - B.z)) / d;
      const uz = (a2*(C.x - B.x) + b2*(A.x - C.x) + c2*(B.x - A.x)) / d;
      const r2 = Math.pow(A.x - ux, 2) + Math.pow(A.z - uz, 2);
      if(pts.every(function(p, k) { return k === a || k === b || k === c || Math.pow(p.x - ux, 2) + Math.pow(p.z - uz, 2) > r2 - 1e-9; })) {
        pos.push(A.x, A.y, A.z, B.x, B.y, B.z, C.x, C.y, C.z);
      }
    }
    const g = new THREE.BufferGeometry(); g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
    dyn.add(new THREE.Mesh(g, new THREE.MeshBasicMaterial({color: 0x18a018, transparent: true, opacity: .3, side: THREE.DoubleSide, depthWrite: false})));
    dyn.add(new THREE.LineSegments(new THREE.WireframeGeometry(g), new THREE.LineBasicMaterial({color: 0x0a6a0a})));
  }

  function scene3() {
    disposeDyn(); clrDyn();
    if(s >= 1 && s <= N) {
      const f = s-1, o = P(R[f]); addBox(o, MAXC, 0xffd700, .13, 0xb08900);
      ALL.forEach(function(j) { if (j !== f && dom(f, j)) arrow(o, P(R[j])); });
    }
    if(s === N+2) {
      const o = P(R[ex]); addBox(ZERO, o, 0x2f6fe0, .15, 0x104020);
      ALL.forEach(function(j) { if(j !== ex && dom(j, ex)) arrow(P(R[j]), o); });
    }
    if(s === N+3 && surf) surface();
    if(s === N+4) {
      const a = P([''].concat(IDEAL)), b = P([''].concat(NADIR)); 
      addBox(a, b, 0x9030c0, .07, 0x7020a0);
      gem(a, 0xff00ff, .42, 'ideal', '#a000a0', -.75); gem(b, 0x7030c0, .42, 'nadir', '#600080', -.75);
    }
    if(s === N+5) {
      const a = P([''].concat(IDEAL)), k = P(R[KI]); 
      dyn.add(new THREE.Line(new THREE.BufferGeometry().setFromPoints([a, k]), new THREE.LineBasicMaterial({color: 0xff6600})));
      gem(a, 0xff00ff, .32, 'ideal', '#a000a0', -.6); 
      mk('knee: ' + R[KI][0], k.clone().add(v3(0, .95, 0)), 'ax', '#cc4400', true);
    }
    if(s === N+6) {
      ALL.forEach(function(a) { ALL.forEach(function(b) {
        if(dom(a, b)) {
          const o = P(R[a]); arrow(o, P(R[b]));
          const m = new THREE.Mesh(new THREE.RingGeometry(.4, .52, 28), new THREE.MeshBasicMaterial({color: 0xff8800, side: THREE.DoubleSide}));
          m.position.copy(o); m.userData.bb = 1; dyn.add(m);
        }
      }); });
    }
  }

  window.testEx = function(i) { ex = i; upd(); };
  window.toggleSurf = function() { surf = !surf; upd(); };

  const sym = function(x,y) { return x < y ? '<td class="s b">&lt; ' + y + '</td>' : x > y ? '<td class="s w">&gt; ' + y + '</td>' : '<td class="s t">= ' + y + '</td>'; };

  function panel() {
    const q = ND(), F = s > 0 ? R[s-1] : null;
    if(s === 0) {
      pn.innerHTML = '<h2>The rule</h2><p><b>A dominates B</b> when A is <b>no worse</b> in every objective and <b>strictly better</b> in at least one.</p><div class="f">f<sub>i</sub>(A) &le; f<sub>i</sub>(B) for all i<br>f<sub>i</sub>(A) &lt; f<sub>i</sub>(B) for some i</div><p>Our 3 objectives (all minimized):<br><b>Price (₹)</b>, <b>-Comfort</b> (comfort negated), <b>Time</b>.</p><p>We take each of the <b>10 Uber options</b> in turn as the <i>focus</i>, check it against the other 9, and draw an arrow to everything it dominates.</p><p class="sum">Press Next to begin.</p><p class="hint">Drag to rotate | scroll or pinch to zoom | tap a point for its values | keys to step</p>'; 
      return;
    }
    if(s === N+1) {
      const f2 = ALL.filter(function(i) { return !nd(i); }); 
      pn.innerHTML = '<h2>Result: non-dominated vs dominated</h2><p class="sum b">Non-dominated (' + q.length + ')</p><p>' + q.map(function(i) { return (i+1) + ' ' + R[i][0]; }).join(' | ') + '</p><p class="sum w">Dominated (' + f2.length + ')</p><p>' + f2.map(function(i) { const j = ALL.filter(function(k) { return dom(k, i); })[0]; return (i+1) + ' ' + R[i][0] + ' dominated by ' + (j+1) + ' ' + R[j][0]; }).join('<br>') + '</p><p>The 8 green points are the best trade-offs: no weights chosen, yet 2 rides are eliminated. Next gives them their proper names.</p>'; 
      return;
    }
    if(s === N+2) {
      const o = R[ex], dm = ALL.filter(function(j) { return j !== ex && dom(j, ex); });
      pn.innerHTML = '<h2>Pareto-optimal solution</h2><p>A solution is <b>Pareto-optimal</b> if <b>no other feasible solution dominates it</b>: no objective can be improved without worsening another.</p><p>Test a ride - click a number:</p><div>' + ALL.map(function(j) { return '<button style="padding:.1em .6em; margin:2px' + (j === ex ? '; background:#ffd700' : '') + '" onclick="window.testEx(' + j + ')">' + (j+1) + '</button>'; }).join('') + '</div><div class="f">' + (ex+1) + ' ' + o[0] + ' (' + o[1] + ', ' + o[2] + ', ' + o[3] + ')</div><p>The <b style="color:#1040a0">blue box</b> holds every point that is no worse in all three objectives.</p><p class="sum">' + (dm.length ? '<span class="w">Inside it: ' + dm.map(function(j) { return R[j][0]; }).join(', ') + ' dominated, NOT Pareto-optimal.</span>' : '<span class="b">Nothing else inside - Pareto-optimal</span>') + '</p>'; 
      return;
    }
    if(s === N+3) {
      pn.innerHTML = '<h2>Set vs. front</h2><p><b>Pareto-optimal set</b> - the <i>solutions themselves</i>:</p><p class="sum b">{' + q.map(function(i) { return R[i][0]; }).join(', ') + '}</p><p><b>Pareto front</b> - their <i>objective vectors</i>, the 8 green points:</p><table><tr><th>Ride</th><th>Price</th><th>-Comf</th><th>Time</th></tr>' + q.map(function(i) { return '<tr><td>' + R[i][0] + '</td><td>' + R[i][1] + '</td><td>' + R[i][2] + '</td><td>' + R[i][3] + '</td></tr>'; }).join('') + '</table><p class="hint">These are 8 discrete rides, so the true front is 8 points. A continuous problem with 3 objectives can have a front that is a surface; the green sheet only illustrates that idea. Points on it between rides are not real options.</p><button onclick="window.toggleSurf()">' + (surf ? 'Hide' : 'Show') + ' illustrative surface</button>'; 
      return;
    }
    if(s === N+4) {
      pn.innerHTML = '<h2>Ideal &amp; nadir points</h2><p><b>Ideal point</b> - the best value of each objective on its own:</p><div class="f">z* (' + IDEAL.join(', ') + ')</div><p>No ride has all three (Bike Saver is cheapest, Black most comfortable, GO Priority fastest) - that is the conflict.</p><p><b>Nadir point</b> - the worst value of each objective over the non-dominated set:</p><div class="f">z_nad = (' + NADIR.join(', ') + ')</div><p>Together they form the purple box that contains the whole front.</p>'; 
      return;
    }
    if(s === N+5) {
      const arr = q.slice().sort(function(a,b) { return kd(a) - kd(b); }); 
      pn.innerHTML = '<h2>Knee point</h2><p>The <b>knee</b> is where a small gain in one objective starts to cost a lot in another. A common heuristic: the non-dominated point <b>closest to the ideal</b> after normalising each objective between ideal and nadir.</p><div class="f">d = &radic;&Sigma; ((f<sub>i</sub> - z<sub>i</sub>*) / (z<sub>i</sub>nad - z<sub>i</sub>*))&sup2;</div><table><tr><th>Ride</th><th>d</th></tr>' + arr.map(function(i) { return '<tr class="' + (i === KI ? 'kn' : '') + '"><td>' + R[i][0] + '</td><td class="s">' + kd(i).toFixed(3) + '</td></tr>'; }).join('') + '</table><p class="sum">Knee here: <span style="color:#cc4400">' + R[KI][0] + '</span> - a balanced pick on this heuristic.</p><p class="hint">The orange line joins the ideal point to the knee.</p>'; 
      return;
    }
    if(s === N+6) {
      const pr = []; ALL.forEach(function(a) { ALL.forEach(function(b) { if(dom(a, b)) pr.push([a, b]); }); }); 
      const nw = ALL.reduce(function(n, a) { return n + ALL.filter(function(b) { return weak(a, b); }).length; }, 0);
      const ns = ALL.reduce(function(n, a) { return n + ALL.filter(function(b) { return strict(a, b); }).length; }, 0);
      pn.innerHTML = '<h2>Weak vs. strict dominance</h2><table><tr><th>Relation</th><th>Condition</th></tr><tr><td>Weak</td><td>f<sub>i</sub>(x) &le; f<sub>i</sub>(y) for all i</td></tr><tr><td><b>Pareto &lt;</b></td><td>weak <b>+</b> &lt; in at least one i</td></tr><tr><td>Strict &lt;&lt;</td><td>f<sub>i</sub>(x) &lt; f<sub>i</sub>(y) for <b>all</b> i</td></tr></table><p class="sum">x &lt;&lt; y &rArr; x &lt; y &rArr; x &le; y (not the reverse)</p><p>Pareto-dominance pairs in this data:</p>' + pr.map(function(pair) { const a = pair[0], b = pair[1]; return '<p style="margin:.2em 0"><b style="color:#cc4400">' + R[a][0] + ' &lt; ' + R[b][0] + '</b><br><span class="s">' + [1,2,3].map(function(d) { return R[a][d] < R[b][d] ? '&lt;' : '='; }).join('') + '</span> &nbsp; (Price, Comf, Time)</p>'; }).join('') + '<p>Weak pairs: <b>' + nw + '</b> | Pareto pairs: <b>' + pr.length + '</b> | Strict pairs: <b>' + ns + '</b>. Every pair ties somewhere, so strict dominance never occurs here.</p><p class="hint">Orange rings mark the dominators; arrows point at the dominated.</p>'; 
      return;
    }
    
    let h = '<h2>Step ' + s + '/' + N + ' - focus: ' + s + ' ' + F[0] + '</h2><div class="f">(' + F[1] + ', ' + F[2] + ', ' + F[3] + ')</div><table><tr><th>vs.</th><th>Price</th><th>-Comf</th><th>Time</th><th>Verdict</th></tr>', dm = [], db = [];
    R.forEach(function(r, j) {
      if(j === s-1) return; 
      const a = dom(s-1, j), b = dom(j, s-1); 
      if(a) dm.push(r[0]); if(b) db.push(r[0]);
      h += '<tr class="' + (a ? 'dm' : b ? 'db' : '') + '"><td>' + (j+1) + ' ' + r[0] + '</td>' + [1,2,3].map(function(d) { return sym(F[d], r[d]); }).join('') + '<td class="v">' + (a ? '<span class="w">dominated</span>' : b ? '<span style="color:#a05a00">X dominates focus</span>' : '<span class="t">- trade-off</span>') + '</td></tr>';
    });
    pn.innerHTML = h + '</table><p class="sum">' + (dm.length ? 'Focus dominates: ' + dm.join(', ') + '.' : 'Focus dominates nothing.') + (db.length ? '<br><span style="color:#a05a00">It is dominated by: ' + db.join(', ') + '.</span>' : '') + '</p><p class="hint">&lt; focus better | tie | &gt; focus worse</p>';
  }

  function upd() { 
    colors(); panel(); scene3(); 
    byId('pr').textContent = s === 0 ? 'Intro' : s === N+1 ? 'Result' : s > N ? 'Terms ' + (s-N-1) + '/5' : 'Step ' + s + '/' + N; 
    byId('pv').disabled = s === 0; byId('nx').disabled = s === END; 
  }

  const go = function(n) { 
    s = Math.max(0, Math.min(END, n)); 
    if (document.activeElement && document.activeElement.blur) document.activeElement.blur(); 
    upd(); 
  };

  byId('nx').onclick = function() { go(s+1); }; 
  byId('pv').onclick = function() { go(s-1); }; 
  byId('fin').onclick = function() { go(N+1); }; 
  byId('rs').onclick = function() { go(0); };
  byId('ar').onclick = function(e) { auto = !auto; e.currentTarget.textContent = 'Auto-rotate: ' + (auto ? 'on' : 'off'); };

  window.addEventListener('keydown', function(e) {
    if(e.key === 'ArrowRight' || e.key === 'PageDown' || e.key === ' ') { e.preventDefault(); go(s+1); }
    if(e.key === 'ArrowLeft' || e.key === 'PageUp') { e.preventDefault(); go(s-1); }
  });

  ['gesturestart', 'gesturechange', 'gestureend'].forEach(function(t) { document.addEventListener(t, function(e) { e.preventDefault(); }, {passive: false}); });
  cv.addEventListener('contextmenu', function(e) { e.preventDefault(); });

  let lx = 0, ly = 0, downX = 0, downY = 0, downT = 0;
  const rc = new THREE.Raycaster(), mp = new THREE.Vector2();

  function ray(x, y) {
    const b = cv.getBoundingClientRect(); 
    mp.set((x - b.left) / b.width * 2 - 1, -(y - b.top) / b.height * 2 + 1); 
    rc.setFromCamera(mp, cam); 
    const h = rc.intersectObjects(S)[0]; 
    return h ? h.object.userData.i : -1;
  }

  function showTip(i, cx, cy) {
    if(i < 0) { tip.style.display = 'none'; return; } 
    const b = cv.getBoundingClientRect(), r = R[i];
    tip.innerHTML = '<b>' + (i+1) + ' ' + r[0] + '</b><br>Price ₹' + r[1] + ' | -Comfort ' + r[2] + ' | Time ' + r[3] + '<br>' + (nd(i) ? '<span class="b">non-dominated</span>' : '<span class="w">dominated by ' + ALL.filter(function(j) { return dom(j, i); }).map(function(j) { return R[j][0]; }).join(', ') + '</span>');
    tip.style.display = 'block';
    tip.style.left = Math.max(4, Math.min(cx - b.left + 16, b.width - tip.offsetWidth - 6)) + 'px';
    tip.style.top = Math.max(4, Math.min(cy - b.top + 12, b.height - tip.offsetHeight - 6)) + 'px';
  }

  cv.addEventListener('pointerdown', function(e) {
    if(pinching) return;
    if(e.pointerType === 'touch' && e.isPrimary === false) return;
    drag = true; vth = vph = 0; lx = e.clientX; ly = e.clientY; downX = e.clientX; downY = e.clientY; downT = performance.now();
    tip.style.display = 'none';
    try { cv.setPointerCapture(e.pointerId); } catch(_) {}
    cv.style.cursor = 'grabbing';
  });

  cv.addEventListener('pointermove', function(e) {
    if(drag && !pinching) {
      vth = -(e.clientX - lx) * .008; vph = -(e.clientY - ly) * .006;
      th += vth; ph = Math.max(.2, Math.min(1.5, ph + vph));
      lx = e.clientX; ly = e.clientY; lastMv = performance.now(); return;
    }
    if(e.pointerType === 'touch') return;
    showTip(ray(e.clientX, e.clientY), e.clientX, e.clientY);
  });

  function endPointer(e) {
    const Math_hypot = function(dx, dy) { return Math.sqrt(dx*dx + dy*dy); };
    const wasTap = Math_hypot(e.clientX - downX, e.clientY - downY) < 10 && (performance.now() - downT) < 450;
    drag = false; cv.style.cursor = 'grab';
    if(performance.now() - lastMv > 90) vth = vph = 0;
    if(pinching) return;
    if(e.pointerType === 'touch' && wasTap) showTip(ray(e.clientX, e.clientY), e.clientX, e.clientY);
  }

  cv.addEventListener('pointerup', endPointer);
  cv.addEventListener('pointercancel', function(e) { drag = false; pinching = false; pinchStart = 0; cv.style.cursor = 'grab'; });
  cv.addEventListener('pointerleave', function(e) { if(e.pointerType === 'mouse') tip.style.display = 'none'; });
  cv.addEventListener('wheel', function(e) { e.preventDefault(); rad = Math.max(10, Math.min(34, rad + e.deltaY * .02)); }, {passive: false});

  const getHypot = function(t0, t1) { return Math.sqrt(Math.pow(t0.clientX - t1.clientX, 2) + Math.pow(t0.clientY - t1.clientY, 2)); };

  cv.addEventListener('touchstart', function(e) {
    if(e.touches.length === 2) {
      pinching = true; drag = false; vth = vph = 0; tip.style.display = 'none';
      pinchStart = getHypot(e.touches[0], e.touches[1]);
      pinchRad = rad;
    }
  }, {passive: true});

  cv.addEventListener('touchmove', function(e) {
    if(pinching && e.touches.length === 2 && pinchStart > 0) {
      e.preventDefault();
      const d = getHypot(e.touches[0], e.touches[1]);
      if(d > 0) rad = Math.max(10, Math.min(34, pinchRad * (pinchStart / d)));
    }
  }, {passive: false});

  function touchEnd(e) { if(e.touches.length < 2) { pinching = false; pinchStart = 0; } }
  cv.addEventListener('touchend', touchEnd);
  cv.addEventListener('touchcancel', touchEnd);

  function size() {
    const r = cv.getBoundingClientRect();
    W = Math.max(1, Math.round(r.width)); H = Math.max(1, Math.round(r.height));
    rd.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
    rd.setSize(W, H, false);
    cam.aspect = W / H; cam.updateProjectionMatrix();
  }

  if(window.ResizeObserver) {
    const ro = new ResizeObserver(function() { size(); }); ro.observe(cv);
  } else {
    window.addEventListener('resize', size);
    window.addEventListener('orientationchange', function() { setTimeout(size, 220); });
  }

  size(); upd();

  (function loop() {
    requestAnimationFrame(loop);
    if(!drag && !pinching) {
      th += vth + (auto ? .0025 : 0);
      ph = Math.max(.2, Math.min(1.5, ph + vph));
      vth *= .93; vph *= .93;
    }
    cam.position.set(ctr.x + rad * Math.sin(ph) * Math.sin(th), ctr.y + rad * Math.cos(ph), ctr.z + rad * Math.sin(ph) * Math.cos(th));
    cam.lookAt(ctr); cam.updateMatrixWorld();
    dyn.children.forEach(function(c) { if(c.userData.bb) c.quaternion.copy(cam.quaternion); });
    rd.render(sc, cam);
    
    for(let i = 0; i < LB.length; i++) place(LB[i]);
    for(let i = 0; i < DLB.length; i++) place(DLB[i]);
  })();
};
</script>
</body>
</html>
